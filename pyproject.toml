[project]
name = "afterset"
version = "0.4.0"
description = "Personal Garmin training, sleep, and recovery records"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "garminconnect>=0.3.20,<0.4",
    "typer>=0.12.0",
    "platformdirs>=4.3",
    "tzdata>=2025.2",
    "keyring>=25.7.0",
    "mcp>=1.30,<2",
    "pydantic>=2.11,<3",
    "starlette>=0.49.1",
    "cryptography>=46",
    "garmin-connect-personal-api-python>=1,<2",
]

[project.urls]
Homepage = "https://github.com/oglu/afterset"
Documentation = "https://github.com/oglu/afterset/tree/main/docs"
Issues = "https://github.com/oglu/afterset/issues"
Container = "https://github.com/users/oglu/packages/container/package/afterset"

[project.optional-dependencies]
analysis = ["pandas>=2.2.0", "seaborn>=0.13.0", "matplotlib>=3.8.0"]

[project.scripts]
afterset = "afterset.cli:app"
afterset-mcp = "afterset.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["afterset"]

[tool.hatch.build.targets.sdist]
include = [
    "/afterset", "/plugin", "/examples", "/scripts", "/tests", "/docs",
    "/.github", "/.agents", "/.claude-plugin", "/.dockerignore", "/.gitignore", "/.python-version", "/.env.example",
    "/Dockerfile", "/railway.json", "/pyproject.toml", "/README.md", "/LICENSE", "/SECURITY.md", "/CHANGELOG.md", "/uv.lock",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
